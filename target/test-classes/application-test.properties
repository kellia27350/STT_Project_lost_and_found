# ── Test profile configuration ─────────────────────────────────────────────
# Loaded automatically when a test class carries @ActiveProfiles("test").
# Wires the application to an H2 in-memory database so integration tests
# never touch any real data.

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:lostandfound_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# create-drop builds the schema fresh when the context starts and drops
# it when it shuts down — perfect for isolated test runs.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# ── H2 console (optional — handy when debugging tests locally) ───────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ───────────────────────────────────────────────────────────────────────
# Fixed secret for tests so token generation is deterministic.
app.jwt.secret=test-secret-key-that-is-32-chars-long!!

# ── Security ─────────────────────────────────────────────────────────────────
# Disable the auto-generated security password so test HTTP headers drive auth.
spring.security.user.name=testuser
spring.security.user.password=testpass

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.auca.lostandfound=DEBUG
