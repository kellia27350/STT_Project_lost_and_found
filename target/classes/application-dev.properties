# ── Dev profile — uses H2 in-memory database ────────────────────────────────
# Start the server with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# No MySQL required. Data is lost when the server stops (perfect for dev/demo).

# ── Database (H2) ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:lostandfound_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 browser console (open http://localhost:8080/h2-console) ───────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=dev-secret-key-that-is-32-chars-long!!!

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.auca.lostandfound=DEBUG
logging.level.org.springframework.security=DEBUG
