# ── Application identity ────────────────────────────────────────────────────
spring.application.name=campus-lost-and-found

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Database (MySQL — production / staging) ──────────────────────────────────
# Override these values via environment variables in your deployment:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lostandfound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' adds missing columns/tables without dropping data.
# Change to 'validate' once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# ── JWT ───────────────────────────────────────────────────────────────────────
# Override via environment variable JWT_SECRET in production.
# Must be at least 32 characters for HS256.
app.jwt.secret=${JWT_SECRET:campus-lost-found-default-secret-key-32chars!!}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.auca.lostandfound=INFO
logging.level.org.springframework.security=WARN
