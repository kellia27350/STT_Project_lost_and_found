plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auca.lostandfound'
    compileSdk 34

    defaultConfig {
        applicationId "com.auca.lostandfound"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Base URL for the backend REST API.
        // Override in a local.properties or via a build flavor for staging/prod.
        buildConfigField "String", "BASE_URL", '"http://10.0.2.2:8080/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Navigation component
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.2'

    // Retrofit 2 + Gson converter
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // OkHttp logging interceptor (debug builds only)
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Glide — image loading for item photos
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Chip / filter UI already included via Material library
}
